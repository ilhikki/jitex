name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without a leading v (e.g. 0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Build
        env:
          JITEX_VERSION: ${{ inputs.version }}
        run: deno task build:jitex

      - name: Verify bundled licenses
        run: |
          for f in LICENSE LICENSE.knuth fonts/OFL.txt; do
            test -f "dist/lib/$f" || { echo "::error::missing dist/lib/$f"; exit 1; }
          done

      - name: Package dist/lib
        run: |
          cd dist/lib
          zip -r "$GITHUB_WORKSPACE/jitex-${{ inputs.version }}.zip" .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
          ASSET: jitex-${{ inputs.version }}.zip
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          args=( --title "$TAG" --generate-notes )
          if [ "$PRERELEASE" = "true" ]; then
            args+=( --prerelease )
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, updating"

            # 1) refresh title / notes / prerelease flag
            gh release edit "$TAG" "${args[@]}"

            # 2) upload or overwrite the asset (--clobber is the key)
            gh release upload "$TAG" "$ASSET" --clobber
          else
            echo "::notice::Release $TAG not found, creating"
            gh release create "$TAG" "$ASSET" "${args[@]}"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4