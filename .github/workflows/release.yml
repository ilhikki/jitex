name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without a leading v (e.g. 0.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno
        uses: actions/cache@v4
        with:
          path: ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Build
        env:
          JITEX_VERSION: ${{ inputs.version }}
        run: deno task build:jitex

      - name: Verify bundled licenses
        run: |
          for f in LICENSE LICENSE.knuth fonts/OFL.txt; do
            test -f "dist/lib/$f" || { echo "::error::missing dist/lib/$f"; exit 1; }
          done

      - name: Package dist/lib
        run: |
          cd dist/lib
          zip -r "$GITHUB_WORKSPACE/jitex-${{ inputs.version }}.zip" .

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=( "v${{ inputs.version }}" "jitex-${{ inputs.version }}.zip" --title "v${{ inputs.version }}" --generate-notes )
          if [ "${{ inputs.prerelease }}" = "true" ]; then args+=( --prerelease ); fi
          gh release create "${args[@]}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
