name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check
        run: |
          deno check \
            src/runtime/mod.ts \
            src/pascal-to-js/mod.ts \
            src/integration/mod.ts \
            src/tex-runtime/mod.ts \
            src/boot-tex/tex/boot-plain.ts \
            src/boot-tex/tex/boot-trip.ts \
            src/boot-tex/tangle/boot-tangle.ts \
            src/boot-tex/jitex/build-jitex.ts

      - name: Test
        run: deno test --allow-read --allow-write --allow-env

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint
