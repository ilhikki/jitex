<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JiTex</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./fonts.css">
</head>
<body>

<div class="app stack">
  <header class="topbar row">
    <span class="logo"></span>
  </header>

  <main class="main row">
    <section class="source-panel panel stack">
      <div class="tab-bar row">
        <div class="panel-title">Plain TeX</div>
        <button class="run-btn clickable" type="button">Run</button>
      </div>
      <div class="panel-content stack">
        <div class="code row mono">
          <pre class="gutter" aria-hidden="true"></pre>
          <textarea class="code-body scroll" id="source" spellcheck="false" autocomplete="off" wrap="off"></textarea>
        </div>
      </div>
    </section>

    <div class="pages-panel panel stack" id="right" data-active="pages">
      <nav class="tab-bar row">
        <div class="panel-title" id="tab-title"></div>
        <div>
          <span class="text-subtle" id="time-cost"></span>
          <button class="tab-button clickable" id="tab-button" type="button"></button>
        </div>
      </nav>
      <div class="panel-content stack">
        <section class="tab-content scroll" id="pages-area" data-tab="pages">
          <div class="pages stack"></div>
        </section>
        <section class="tab-content scroll" id="console-area" data-tab="console">
          <div class="code row mono">
            <pre class="gutter" aria-hidden="true"></pre>
            <pre class="code-body scroll" id="console"></pre>
          </div>
        </section>
      </div>
    </div>
  </main>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
