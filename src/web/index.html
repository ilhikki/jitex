<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JiTex</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./fonts.css">
  </head>
  <body>
    <header>
      <span id="logo"></span>
      <button id="run" type="button">Run</button>
    </header>

    <main id="main">
      <section id="source-area" class="pane">
        <h2 class="title">Plain TeX</h2>
        <textarea id="source" spellcheck="false" autocomplete="off" wrap="off"></textarea>
      </section>

      <div class="right" data-active="pages">
        <nav class="tab-bar">
          <button type="button" data-tab="pages">Pages</button>
          <button type="button" data-tab="console">Console</button>
        </nav>
        <section id="pages-area">
          <div class="pages"></div>
        </section>
        <section id="console-area">
          <pre id="console"></pre>
        </section>
      </div>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
