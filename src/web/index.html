<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JiTex</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./fonts.css">
</head>
<body>

<header>
  <span id="logo"></span>
  <button id="run" type="button">Run</button>
</header>

<main id="main">
  <section id="source-area" class="pane">
    <div class="title">Plain TeX</div>
    <div class="code">
      <pre class="gutter" aria-hidden="true"></pre>
      <textarea id="source" spellcheck="false" autocomplete="off" wrap="off"></textarea>
    </div>
  </section>

  <div class="right" data-active="pages">
    <nav class="tab-bar">
      <div class="title" data-tab="pages">Pages</div>
      <div class="title" data-tab="console">Console</div>
    </nav>
    <section id="pages-area">
      <div class="pages"></div>
    </section>
    <section id="console-area">
      <div class="code">
        <pre class="gutter" aria-hidden="true"></pre>
        <pre id="console"></pre>
      </div>
    </section>
  </div>
</main>

<script type="module" src="./app.js"></script>
</body>
</html>
