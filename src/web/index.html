<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>jitex — TeX82 in the browser</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <!--
      演示页：三个文件（index.html / styles.css / app.js），app.js 用原生 ESM import
      同目录的 jitex.js。build:jitex 第 6 段把它们一起拷进 dist/。

      一、页面里不出现以 / 开头的路径：Pages 挂在 /<repo>/ 下，绝对路径会白屏。
      二、没有 Worker：TeX 是同步执行、没有协作式中断点，放哪个线程、怎么中断，是使用
          者适配层该决定的（库不含 Worker）。演示页跑在主线程上，因此也可能被一段失控
          的文档卡住——真项目请把引擎放进 Worker。
    -->
    <header>
      <h1>jitex</h1>
      <span class="sub">TeX82 → DVI → SVG，全部在浏览器里跑</span>
      <span class="spacer"></span>
      <span id="status" class="status">就绪</span>
      <button id="run" type="button">运行 (Ctrl/⌘ + Enter)</button>
    </header>

    <main>
      <section class="pane pane-input">
        <h2>TeX 输入</h2>
        <textarea id="source" spellcheck="false" autocomplete="off"></textarea>
      </section>
      <section class="pane pane-output">
        <h2>SVG 输出 <span id="pages-info" class="info"></span></h2>
        <div id="pages" class="pages"></div>
      </section>
      <section class="pane pane-console">
        <h2>TeX 控制台</h2>
        <pre id="console"></pre>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
